<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial - Depósito El Gato</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #007BFF;
    }
    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .top-menu {
      display: flex;
      justify-content: space-around;
      margin-bottom: 15px;
    }
    .top-menu a {
      text-decoration: none;
      background: #28a745;
      color: white;
      padding: 8px 15px;
      border-radius: 5px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }
    th {
      background: #007BFF;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Historial de Facturas</h1>

    <div class="top-menu">
      <a href="index.html">Inicio</a>
      <a href="inventario.html">Inventario</a>
      <a href="facturacion.html">Facturación</a>
    </div>

    <table id="tabla">
      <thead>
        <tr>
          <th>No. Factura</th>
          <th>Cliente</th>
          <th>NIT</th>
          <th>Fecha</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const historial = JSON.parse(localStorage.getItem("historial")) || [];
    const tbody = document.querySelector("#tabla tbody");

    historial.forEach(f => {
      tbody.innerHTML += `
        <tr>
          <td>${f.numero}</td>
          <td>${f.cliente}</td>
          <td>${f.nit}</td>
          <td>${f.fecha}</td>
          <td>$${f.total.toLocaleString("es-CO")}</td>
        </tr>`;
    });
  </script>
</body>
</html>
