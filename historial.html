<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial - Depósito El Gato</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
    .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
    .header img { height: 80px; }
    .top-menu { display: flex; justify-content: space-around; margin-bottom: 20px; gap:10px; flex-wrap:wrap; }
    .top-menu a { background: #007BFF; padding: 10px 20px; text-decoration: none; color: white; border-radius: 5px; font-weight:bold; }
    
    .filters-panel { background: #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 15px; }
    .filters-panel input { padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
    .filter-group { display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: bold; }
    
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
    th { background: #343a40; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    .summary-box { text-align: right; margin-top: 15px; padding: 15px; background: #d4edda; color: #155724; border-radius: 8px; font-size: 18px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <img src="logo.png" alt="Logo">
    <h1>Historial de Ventas</h1>
  </div>

  <div class="top-menu">
    <a href="index.html">Inicio</a>
    <a href="inventario.html" style="background:#28a745;">Inventario</a>
    <a href="facturacion.html">Facturación</a>
    <a href="facturas.html" style="background:#6c757d;">Facturas Guardadas</a>
  </div>

  <div class="filters-panel">
    <div class="filter-group">
      <label>Buscar Cliente / NIT:</label>
      <input type="text" id="searchClient" placeholder="Ej: Juan..." onkeyup="filtrarHistorial()">
    </div>
    <div class="filter-group">
      <label>Desde:</label>
      <input type="date" id="dateFrom" onchange="filtrarHistorial()">
    </div>
    <div class="filter-group">
      <label>Hasta:</label>
      <input type="date" id="dateTo" onchange="filtrarHistorial()">
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>No. Factura</th>
        <th>Cliente</th>
        <th>NIT / Cédula</th>
        <th>Fecha</th>
        <th>Total Cobrado</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="summary-box">
    <strong>Total Ventas en Periodo:</strong> <span id="totalVentas">$0</span>
  </div>
</div>

<script>
const historial = JSON.parse(localStorage.getItem("historial")) || [];
const tbody = document.getElementById("tbody");
const totalVentasEl = document.getElementById("totalVentas");

function filtrarHistorial() {
  const buscador = document.getElementById("searchClient").value.toLowerCase();
  const fechaDesde = document.getElementById("dateFrom").value;
  const fechaHasta = document.getElementById("dateTo").value;
  
  tbody.innerHTML = "";
  let sumaTotal = 0;
  let contador = 0;

  historial.forEach(f => {
    const coincideTexto = f.cliente.toLowerCase().includes(buscador) || f.nit.toLowerCase().includes(buscador);
    let coincideFecha = true;
    if (fechaDesde && f.fecha < fechaDesde) coincideFecha = false;
    if (fechaHasta && f.fecha > fechaHasta) coincideFecha = false;

    if (coincideTexto && coincideFecha) {
      sumaTotal += f.total;
      contador++;
      tbody.innerHTML += `<tr><td><strong>${f.numero}</strong></td><td>${f.cliente}</td><td>${f.nit}</td><td>${f.fecha}</td><td>$${f.total.toLocaleString("es-CO")}</td></tr>`;
    }
  });

  if (contador === 0) tbody.innerHTML = `<tr><td colspan="5">No hay registros para este filtro.</td></tr>`;
  totalVentasEl.textContent = "$" + sumaTotal.toLocaleString("es-CO");
}

filtrarHistorial();
</script>
</body>
</html>
