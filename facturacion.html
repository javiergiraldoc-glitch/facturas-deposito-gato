<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facturación - Depósito El Gato</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
    .container {
      max-width: 900px; margin: auto; background: white;
      padding: 20px; border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
    .header img { height: 80px; }
    .top-menu { display: flex; justify-content: space-around; margin-bottom: 15px; gap: 10px; flex-wrap: wrap; }
    .top-menu a {
      text-decoration: none; background: #28a745; color: white;
      padding: 8px 15px; border-radius: 5px; font-weight: bold;
    }
    input, select, button {
      padding: 8px; margin: 5px;
      border: 1px solid #ccc; border-radius: 5px;
    }
    button { cursor: pointer; background: #007BFF; color: white; border: none; }
    button:hover { opacity: 0.9; }
    table {
      width: 100%; border-collapse: collapse; margin-top: 10px;
    }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #007BFF; color: white; }
    #preview {
      display: none; border: 2px solid #007BFF;
      padding: 20px; margin-top: 20px;
      border-radius: 10px; background: #f8f9fa;
    }
    .client-box {
      background: #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 15px;
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <img src="logo.png" alt="Logo">
    <h1>Facturación</h1>
  </div>

  <div class="top-menu">
    <a href="index.html" style="background:#007BFF;">Inicio</a>
    <a href="inventario.html">Inventario</a>
    <a href="historial.html" style="background:#17a2b8;">Historial</a>
    <a href="facturas.html" style="background:#007BFF;">Facturas Guardadas</a>
  </div>

  <!-- SECCIÓN DE CLIENTE -->
  <div class="client-box">
    <div style="width: 100%; margin-bottom: 5px;">
      <label><strong>👤 Seleccionar Cliente Registrado:</strong></label>
      <select id="selectCliente" onchange="autocompletarCliente()" style="width: 100%; font-weight: bold; background: #fff;">
        <option value="">-- Seleccionar cliente habitual o escribir uno nuevo abajo --</option>
      </select>
    </div>

    <input type="text" id="cliente" placeholder="Nombre completo del Cliente" style="flex: 2; min-width: 200px;">
    <input type="text" id="nit" placeholder="NIT / Cédula" style="flex: 1; min-width: 130px;">
    <input type="text" id="celular" placeholder="Celular / Teléfono" style="flex: 1; min-width: 130px;">
    <input type="date" id="fecha" style="flex: 1;">
    <button onclick="nuevaFactura(true)" style="background:#dc3545;">🧾 Nueva / Limpiar</button>
  </div>

  <!-- SECCIÓN DE PRODUCTOS -->
  <div style="background: #e9ecef; padding: 10px; border-radius: 8px; margin-bottom: 15px;">
    <input type="text" id="buscarProd" placeholder="🔍 Filtrar producto..." onkeyup="buscarProducto()">
    <select id="productoSelect" style="max-width: 250px;"></select>
    <input type="number" id="cantidad" placeholder="Cantidad" min="1" style="width: 80px;">
    <button onclick="agregarItem()" style="background:#28a745;">➕ Agregar</button>
  </div>

  <table id="tabla">
    <thead>
      <tr>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>Precio Unitario</th>
        <th>Total</th>
        <th>Eliminar</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h3 id="total" style="text-align: right; margin-top: 15px; font-size: 22px; color: #28a745;">Total: $0</h3>
  <button onclick="vistaPrevia()" style="width: 100%; padding: 12px; font-size: 16px; background: #007BFF;">👁️ Ver Vista Previa de Factura</button>

  <!-- VISTA PREVIA -->
  <div id="preview">
    <div class="header" style="border-bottom: 2px solid #333; padding-bottom: 5px;">
      <img src="logo.png" alt="Logo">
      <div>
        <h2>Factura de Venta No. <span id="numFactura"></span></h2>
        <p style="margin:0; color:#666;">Depósito El Gato</p>
      </div>
    </div>

    <p><strong>Cliente:</strong> <span id="prevCliente"></span></p>
    <p><strong>NIT/Cédula:</strong> <span id="prevNit"></span> | <strong>Celular:</strong> <span id="prevCelular"></span></p>
    <p><strong>Fecha:</strong> <span id="prevFecha"></span></p>

    <table id="prevTabla">
      <thead>
        <tr>
          <th>Producto</th>
          <th>Cantidad</th>
          <th>Valor Unitario</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h3 id="prevTotal" style="text-align: right; margin-top: 15px; color:#28a745;"></h3>
    <button onclick="guardarFactura()" style="background: #28a745; width: 100%; padding: 12px; font-size: 16px; font-weight: bold;">💾 Guardar en Facturas Guardadas</button>
  </div>

</div>

<script>
let inventario = JSON.parse(localStorage.getItem("inventario")) || [];
let historial = JSON.parse(localStorage.getItem("historial")) || [];
let clientesGuardados = JSON.parse(localStorage.getItem("clientesGuardados")) || [];
let factura = [];
let numFactura = parseInt(localStorage.getItem("numFactura") || "1");

document.getElementById("fecha").valueAsDate = new Date();

// Cargar Clientes en la lista desplegable
function cargarDirectorioClientes() {
  const select = document.getElementById("selectCliente");
  select.innerHTML = '<option value="">-- Seleccionar cliente habitual o escribir uno nuevo abajo --</option>';
  
  clientesGuardados.forEach((c, index) => {
    const opt = document.createElement("option");
    opt.value = index;
    opt.textContent = `${c.cliente} (Cédula/NIT: ${c.nit})`;
    select.appendChild(opt);
  });
}

function autocompletarCliente() {
  const index = document.getElementById("selectCliente").value;
  if (index !== "") {
    const clienteSel = clientesGuardados[index];
    document.getElementById("cliente").value = clienteSel.cliente;
    document.getElementById("nit").value = clienteSel.nit;
    document.getElementById("celular").value = clienteSel.celular || "";
  } else {
    document.getElementById("cliente").value = "";
    document.getElementById("nit").value = "";
    document.getElementById("celular").value = "";
  }
}

const productoSelect = document.getElementById("productoSelect");
function cargarProductos(lista) {
  productoSelect.innerHTML = "";
  lista.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p.nombre;
    opt.textContent = `${p.nombre} (Stock: ${p.stock})`;
    productoSelect.appendChild(opt);
  });
}

function buscarProducto() {
  const texto = document.getElementById("buscarProd").value.toLowerCase();
  const filtrado = inventario.filter(p => p.nombre.toLowerCase().includes(texto));
  cargarProductos(filtrado);
}

function nuevaFactura(devolverStock = false) {
  if (devolverStock && factura.length > 0) {
    factura.forEach(item => {
      const prod = inventario.find(p => p.nombre === item.nombre);
      if (prod) prod.stock += item.cantidad;
    });
    localStorage.setItem("inventario", JSON.stringify(inventario));
    cargarProductos(inventario);
  }
  factura = [];
  mostrar();
  document.getElementById("preview").style.display = "none";
  document.getElementById("total").textContent = "Total: $0";
  document.getElementById("buscarProd").value = "";
  document.getElementById("selectCliente").value = "";
}

function agregarItem() {
  const nombre = productoSelect.value;
  const cantidad = parseInt(document.getElementById("cantidad").value);

  if (!nombre || isNaN(cantidad) || cantidad <= 0) return alert("Ingrese una cantidad válida");

  const prod = inventario.find(p => p.nombre === nombre);
  if (!prod || prod.stock < cantidad) return alert("Stock insuficiente en depósito");

  const itemExistente = factura.find(f => f.nombre === nombre);
  if (itemExistente) {
    itemExistente.cantidad += cantidad;
    itemExistente.total = itemExistente.cantidad * prod.precio;
  } else {
    const total = prod.precio * cantidad;
    factura.push({ nombre, cantidad, precio: prod.precio, total });
  }

  prod.stock -= cantidad;
  localStorage.setItem("inventario", JSON.stringify(inventario));
  
  document.getElementById("buscarProd").value = "";
  cargarProductos(inventario);
  document.getElementById("cantidad").value = "";
  mostrar();
}

function mostrar() {
  const tbody = document.querySelector("#tabla tbody");
  tbody.innerHTML = "";
  let total = 0;

  factura.forEach((f, i) => {
    total += f.total;
    tbody.innerHTML += `
      <tr>
        <td>${f.nombre}</td>
        <td>${f.cantidad}</td>
        <td>$${f.precio.toLocaleString("es-CO")}</td>
        <td>$${f.total.toLocaleString("es-CO")}</td>
        <td><button onclick="eliminar(${i})" style="background:#dc3545; padding: 3px 8px;">🗑️</button></td>
      </tr>`;
  });
  document.getElementById("total").textContent = "Total: $" + total.toLocaleString("es-CO");
}

function eliminar(i) {
  const item = factura[i];
  const prod = inventario.find(p => p.nombre === item.nombre);
  if (prod) {
    prod.stock += item.cantidad;
    localStorage.setItem("inventario", JSON.stringify(inventario));
    cargarProductos(inventario);
  }
  factura.splice(i, 1);
  mostrar();
}

function vistaPrevia() {
  if (factura.length === 0) return alert("La factura no tiene productos");
  const cliente = document.getElementById("cliente").value.trim();
  const nit = document.getElementById("nit").value.trim();
  const celular = document.getElementById("celular").value.trim();
  const fecha = document.getElementById("fecha").value;

  if (!cliente || !nit || !fecha) return alert("Por favor complete al menos el nombre y la cédula/NIT del cliente");

  document.getElementById("numFactura").textContent = numFactura;
  document.getElementById("prevCliente").textContent = cliente;
  document.getElementById("prevNit").textContent = nit;
  document.getElementById("prevCelular").textContent = celular || "N/A";
  document.getElementById("prevFecha").textContent = fecha;

  const tbody = document.querySelector("#prevTabla tbody");
  tbody.innerHTML = "";
  let total = 0;

  factura.forEach(f => {
    total += f.total;
    tbody.innerHTML += `<tr><td>${f.nombre}</td><td>${f.cantidad}</td><td>$${f.precio.toLocaleString("es-CO")}</td><td>$${f.total.toLocaleString("es-CO")}</td></tr>`;
  });

  document.getElementById("prevTotal").textContent = "Total a Pagar: $" + total.toLocaleString("es-CO");
  document.getElementById("preview").style.display = "block";
  document.getElementById("preview").scrollIntoView({ behavior: 'smooth' });
}

function guardarFactura() {
  const cliente = document.getElementById("cliente").value.trim();
  const nit = document.getElementById("nit").value.trim();
  const celular = document.getElementById("celular").value.trim();
  const fecha = document.getElementById("fecha").value;
  const total = factura.reduce((sum, f) => sum + f.total, 0);

  const data = { numero: numFactura, cliente, nit, celular, fecha, productos: factura, total };
  historial.push(data);
  localStorage.setItem("historial", JSON.stringify(historial));
  
  // Guardar o actualizar datos del cliente en la lista permanente
  const indexExistente = clientesGuardados.findIndex(c => c.nit === nit);
  if (indexExistente !== -1) {
    clientesGuardados[indexExistente] = { cliente, nit, celular };
  } else {
    clientesGuardados.push({ cliente, nit, celular });
  }
  localStorage.setItem("clientesGuardados", JSON.stringify(clientesGuardados));
  
  localStorage.setItem("numFactura", ++numFactura);
  alert("Factura guardada exitosamente y cliente registrado en el directorio.");
  
  document.getElementById("cliente").value = "";
  document.getElementById("nit").value = "";
  document.getElementById("celular").value = "";
  cargarDirectorioClientes();
  nuevaFactura(false);
}

// Inicialización de la página
cargarProductos(inventario);
cargarDirectorioClientes();
</script>
</body>
</html>
