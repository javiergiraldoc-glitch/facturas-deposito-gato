<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facturación - Depósito El Gato</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #007BFF;
    }
    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .top-menu {
      display: flex;
      justify-content: space-around;
      margin-bottom: 15px;
    }
    .top-menu a {
      text-decoration: none;
      background: #28a745;
      color: white;
      padding: 8px 15px;
      border-radius: 5px;
    }
    input, select, button {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin: 5px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }
    th {
      background: #007BFF;
      color: white;
    }
    button {
      background: #007BFF;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    #preview {
      display: none;
      border: 2px solid #007BFF;
      padding: 20px;
      margin-top: 20px;
      border-radius: 10px;
      background: #f8f9fa;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Facturación</h1>

    <div class="top-menu">
      <a href="index.html">Inicio</a>
      <a href="inventario.html">Inventario</a>
      <a href="historial.html">Historial</a>
    </div>

    <div>
      <input type="text" id="cliente" placeholder="Nombre del cliente">
      <input type="text" id="nit" placeholder="NIT / Cédula">
      <input type="date" id="fecha">
      <button onclick="nuevaFactura()">🧾 Nueva Factura</button>
    </div>

    <div>
      <select id="productoSelect"></select>
      <input type="number" id="cantidad" placeholder="Cantidad">
      <button onclick="agregarItem()">Agregar</button>
    </div>

    <table id="tabla">
      <thead>
        <tr>
          <th>Producto</th>
          <th>Cantidad</th>
          <th>Precio Unitario</th>
          <th>Total</th>
          <th>Eliminar</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h3 id="total">Total: $0</h3>
    <button onclick="vistaPrevia()">👁 Vista Previa</button>

    <div id="preview">
      <h2>Factura No. <span id="numFactura"></span></h2>
      <p><strong>Cliente:</strong> <span id="prevCliente"></span></p>
      <p><strong>NIT/Cédula:</strong> <span id="prevNit"></span></p>
      <p><strong>Fecha:</strong> <span id="prevFecha"></span></p>
      <table id="prevTabla" border="1" cellspacing="0" cellpadding="5" width="100%">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Valor Unitario</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <h3 id="prevTotal"></h3>
      <button onclick="guardarFactura()">💾 Guardar Factura</button>
    </div>
  </div>

  <script>
    let inventario = JSON.parse(localStorage.getItem("inventario")) || [];
    let historial = JSON.parse(localStorage.getItem("historial")) || [];
    let factura = [];
    let numFactura = parseInt(localStorage.getItem("numFactura") || "1");

    document.getElementById("fecha").valueAsDate = new Date();

    const productoSelect = document.getElementById("productoSelect");
    inventario.forEach(p => {
      const opt = document.createElement("option");
      opt.value = p.nombre;
      opt.textContent = p.nombre;
      productoSelect.appendChild(opt);
    });

    function nuevaFactura() {
      factura = [];
      mostrar();
      document.getElementById("total").textContent = "Total: $0";
      document.getElementById("preview").style.display = "none";
    }

    function agregarItem() {
      const nombre = document.getElementById("productoSelect").value;
      const cantidad = parseInt(document.getElementById("cantidad").value);
      if (!nombre || isNaN(cantidad) || cantidad <= 0) return alert("Datos inválidos");

      const prod = inventario.find(p => p.nombre === nombre);
      if (!prod || prod.stock < cantidad) return alert("No hay stock suficiente");

      const total = prod.precio * cantidad;
      factura.push({ nombre, cantidad, precio: prod.precio, total });
      prod.stock -= cantidad;
      localStorage.setItem("inventario", JSON.stringify(inventario));
      mostrar();
    }

    function mostrar() {
      const tbody = document.querySelector("#tabla tbody");
      tbody.innerHTML = "";
      let total = 0;

      factura.forEach((f, i) => {
        total += f.total;
        tbody.innerHTML += `
          <tr>
            <td>${f.nombre}</td>
            <td>${f.cantidad}</td>
            <td>$${f.precio.toLocaleString("es-CO")}</td>
            <td>$${f.total.toLocaleString("es-CO")}</td>
            <td><button onclick="eliminar(${i})">🗑</button></td>
          </tr>`;
      });

      document.getElementById("total").textContent = "Total: $" + total.toLocaleString("es-CO");
    }

    function eliminar(i) {
      factura.splice(i, 1);
      mostrar();
    }

    function vistaPrevia() {
      if (factura.length === 0) return alert("Agrega productos primero");

      const cliente = document.getElementById("cliente").value.trim();
      const nit = document.getElementById("nit").value.trim();
      const fecha = document.getElementById("fecha").value;

      if (!cliente || !nit || !fecha) return alert("Completa todos los datos del cliente");

      document.getElementById("numFactura").textContent = numFactura;
      document.getElementById("prevCliente").textContent = cliente;
      document.getElementById("prevNit").textContent = nit;
      document.getElementById("prevFecha").textContent = fecha;

      const tbody = document.querySelector("#prevTabla tbody");
      tbody.innerHTML = "";
      let total = 0;
      factura.forEach(f => {
        total += f.total;
        tbody.innerHTML += `
          <tr>
            <td>${f.nombre}</td>
            <td>${f.cantidad}</td>
            <td>$${f.precio.toLocaleString("es-CO")}</td>
            <td>$${f.total.toLocaleString("es-CO")}</td>
          </tr>`;
      });

      document.getElementById("prevTotal").textContent = "Total a pagar: $" + total.toLocaleString("es-CO");
      document.getElementById("preview").style.display = "block";
    }

    function guardarFactura() {
      const cliente = document.getElementById("cliente").value.trim();
      const nit = document.getElementById("nit").value.trim();
      const fecha = document.getElementById("fecha").value;
      const total = factura.reduce((sum, f) => sum + f.total, 0);

      const data = { numero: numFactura, cliente, nit, fecha, productos: factura, total };
      historial.push(data);
      localStorage.setItem("historial", JSON.stringify(historial));
      localStorage.setItem("numFactura", ++numFactura);

      alert("Factura guardada exitosamente ✅");
      document.getElementById("preview").style.display = "none";
      nuevaFactura();
    }
  </script>
</body>
</html>
