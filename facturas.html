<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facturas Guardadas - Depósito El Gato</title>
  <style>
    body { background: #f5f5f5; padding: 20px; font-family: Arial; }
    .container {
      max-width: 900px; margin: auto; background: white;
      padding: 20px; border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
    .header img { height: 80px; }
    .top-menu {
      display: flex; justify-content: space-around;
      margin-bottom: 20px;
    }
    .top-menu a {
      text-decoration: none; color: white; background: #007BFF;
      padding: 10px 20px; border-radius: 5px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #007BFF; color: white; }
    button { padding: 5px 10px; border: none; background: #28a745; color: white; }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <img src="logo.png">
    <h1>Facturas Guardadas</h1>
  </div>

  <div class="top-menu">
    <a href="index.html">Inicio</a>
    <a href="inventario.html">Inventario</a>
    <a href="facturacion.html">Facturación</a>
    <a href="historial.html">Historial</a>
  </div>

  <table>
    <thead>
      <tr>
        <th>No. Factura</th>
        <th>Cliente</th>
        <th>NIT</th>
        <th>Fecha</th>
        <th>Total</th>
        <th>Ver / Imprimir</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

</div>

<script>
let historial = JSON.parse(localStorage.getItem("historial")) || [];
const tbody = document.getElementById("tbody");

historial.forEach(f => {
  tbody.innerHTML += `
    <tr>
      <td>${f.numero}</td>
      <td>${f.cliente}</td>
      <td>${f.nit}</td>
      <td>${f.fecha}</td>
      <td>$${f.total.toLocaleString("es-CO")}</td>
      <td><button onclick='ver(${f.numero})'>Abrir</button></td>
    </tr>`;
});

function ver(num) {
  alert("Por ahora se abre directo en Vista Previa desde Facturación.");
}
</script>

</body>
</html>
