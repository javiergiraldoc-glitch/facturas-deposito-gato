<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio - Depósito El Gato</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }
    .header img {
      height: 80px;
    }
    .top-menu {
      display: flex;
      justify-content: space-around;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .top-menu a {
      text-decoration: none;
      background: #007BFF;
      color: white;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: bold;
    }
    .top-menu a:hover {
      background: #0056b3;
    }
    .welcome-box {

      padding: 40px;
      background: #e9ecef;
      border-radius: 8px;
      margin-top: 20px;
    }

</head>
<body>
  <div class="container">

    <div class="header">
      <img src="logo.png" alt="Logo">
      <h1>Depósito El Gato</h1>
    </div>

    <div class="top-menu">
      <a href="inventario.html" style="background: #28a745;">Inventario</a>
      <a href="facturacion.html">Facturación</a>
      <a href="historial.html" style="background: #17a2b8;">Historial</a>
      <a href="facturas.html" style="background: #007BFF;">Facturas Guardadas</a>

      <h2>Bienvenido al sistema de administración</h2>
      <p style="color: #555; font-size: 16px;">Seleccione una opción del menú superior para empezar a trabajar.</p>
    </div>

  </div>
</body>
</html>
